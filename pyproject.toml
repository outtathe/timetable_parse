[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-gcal"
version = "0.4.0"
description = "Мини-CLI для добавления событий в Google Calendar (единый модуль add_event)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "You" }]
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "pytz>=2024.1",
]

[project.scripts]
timetable-gcal = "timetable_gcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]